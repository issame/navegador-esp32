; Navegador ESP32 — reloj y navegación para la placa ESP32-C3 con pantalla
; redonda GC9A01 de 1,28" (240x240) de AliExpress.

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32@6.9.0
board = lolin_c3_mini
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps =
	lvgl/lvgl@9.3.0
	lovyan03/LovyanGFX@1.1.16
	fbiego/ChronosESP32@1.9.1
build_flags =
	-I include
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_LVGL_H_INCLUDE_SIMPLE
